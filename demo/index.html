      <span class="cal-label" id="cal-year-label" data-action="tap-year">${disp.yearLabel}</span>
      <div class="cal-corner-arrow ${lang()==='fa'?'left':'right'}" data-action="${nextAction}" aria-label="${t('next')}">${ICONS.chevronRight}</div>
      ${monthDropdown}${yearDropdown}
    </div>
    <div class="cal-mode-tabs">
      <button class="${state.calMode==='day'?'active':''}" data-action="set-cal-mode" data-mode="day">${t('day')}</button>
      <button class="${state.calMode==='week'?'active':''}" data-action="set-cal-mode" data-mode="week">${t('week')}</button>
      <button class="${state.calMode==='month'?'active':''}" data-action="set-cal-mode" data-mode="month">${t('month')}</button>
    </div>
    <div id="cal-gesture-area">${body}</div>

}

/* ============ FAB + MENU (static markup — only classes update, never rebuilt) ============ */
function updateNav(){
  document.getElementById('fab-add').classList.toggle('active', state.navExpanded);
  document.getElementById('fab-menu').classList.toggle('show', state.navExpanded);
  document.getElementById('fab-menu').classList.toggle('labels-hidden', !state.settings.showAddMenuLabels);

  const avatarBtn = document.getElementById('toolbar-avatar-btn');
  if(state.profile.photo){
    avatarBtn.style.backgroundImage = `url('${state.profile.photo}')`;
    avatarBtn.textContent = '';
  } else {
    avatarBtn.style.backgroundImage = 'none';
    avatarBtn.textContent = initials(state.profile.name);
  }

  /* Mobile-only: '+' doesn't make sense while browsing Store/Management
     (reached via the capsule next to this same button), so it swaps to a
     "back to today" control there instead of opening the add-menu — see
     the click handler in initFabAndMenuInteractions() for the behavior. */
  const fab = document.getElementById('fab-add');
  const inStoreOrAdmin = state.menuPanelOpen && (state.menuSubView === 'store' || state.menuSubView === 'admin');
  fab.setAttribute('aria-label', inStoreOrAdmin ? 'Calendar' : 'Add');
  fab.innerHTML = inStoreOrAdmin ? ICONS.calendarIcon
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>';

  const backBtn = document.getElementById('back-today-btn');
  backBtn.textContent = t('backToToday');
  if(window.innerWidth >= 960){
    /* Desktop: anchored only to #page-calendar's own bordered box — not
       #page-home's — exactly centered on its bottom edge, straddling
       the border like a pill. Shown whenever the calendar's cursor
       isn't on today's month (not exact-day, since navigating always
       lands on the 1st of a month). */
    const onCurrentMonth = primaryMonthOf(state.calCursor) === primaryMonthOf(today) && primaryYearOf(state.calCursor) === primaryYearOf(today);
    backBtn.classList.toggle('show', !onCurrentMonth);
    const boxEl = document.getElementById('page-calendar');
    if(boxEl){
      const boxRect = boxEl.getBoundingClientRect();
      backBtn.style.left = (boxRect.left + boxRect.width / 2) + 'px';
      backBtn.style.top = (boxRect.bottom - backBtn.offsetHeight / 2) + 'px';
    }
  } else {
    /* Below 960px, the merged home widget IS the calendar (no separate
       #page-calendar column), so the same button anchors to its own
       desktop-box instead and tracks homeDate. */
    backBtn.classList.toggle('show', !sameDay(state.homeDate, today));
    const boxEl = document.querySelector('#page-home .desktop-box');
    if(boxEl){
      const boxRect = boxEl.getBoundingClientRect();
      backBtn.style.left = (boxRect.left + boxRect.width / 2) + 'px';
      backBtn.style.top = (boxRect.bottom - backBtn.offsetHeight / 2) + 'px';
    }
  }

  /* Quick-add popup aligns to #fab-add's real measured center — desktop
     via `top` (menu opens to the left, vertically centered), mobile via
     `left` (menu opens upward, horizontally centered) — rather than a
     guessed offset, since the toolbar's own size now depends on its
     content (Profile+Management pill width/height). */
  const addRect = fab.getBoundingClientRect();
  const fabMenu = document.getElementById('fab-menu');
  if(window.innerWidth >= 960){
    fabMenu.style.top = (addRect.top + addRect.height / 2) + 'px';
    fabMenu.style.left = '';
  } else {
    fabMenu.style.left = (addRect.left + addRect.width / 2) + 'px';
    fabMenu.style.top = '';
  }
}

function initFabAndMenuInteractions(){
  document.getElementById('fab-add').addEventListener('click', () => {
    if(state.menuPanelOpen && (state.menuSubView === 'store' || state.menuSubView === 'admin')){
      state.menuPanelOpen = false; render();
      return;
    }
    state.navExpanded = !state.navExpanded;
    render();
  });
  // tap outside the fab-menu collapses it
  document.getElementById('device').addEventListener('pointerdown', (e) => {
    if(state.navExpanded && !e.target.closest('#fab-add, #fab-menu')){
      state.navExpanded = false; render();
    }
  });
}

/* Expand/collapse the merged calendar widget — reversed from the old
   behavior by request: scrolling DOWN into the agenda never expands it
   anymore (it collapses back to the week strip instead). The month view
   only opens via a "pull" gesture at the very top of the page: mouse
   wheel scrolled up, or a touch/pointer drag downward, while already at
   scrollTop 0. Nothing here calls preventDefault, so native scrolling
   (wheel and touch) stays completely unaffected either way. */
function initHomeScrollExpand(){
  const el = document.getElementById('page-home');
  el.addEventListener('scroll', () => {
    if(el.scrollTop > 4 && state.calDensity !== 'compact'){
      setCalDensity('compact');
    }
  }, { passive: true });

  let lastWheelDayNav = 0;
  el.addEventListener('wheel', (e) => {
    /* Trackpad horizontal swipe (deltaX-dominant) shifts a day, same
       gesture a touchpad/Magic Mouse user would reach for instinctively —
       separate from the vertical pull-to-expand case below. Debounced so
       one continuous swipe doesn't fire a dozen times. */
    if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){
      if(Math.abs(e.deltaX) > 30 && Date.now() - lastWheelDayNav > 400){
        lastWheelDayNav = Date.now();
        shiftHomeDay(e.deltaX > 0 ? 1 : -1);
      }
      return;
    }
    if(el.scrollTop <= 0 && e.deltaY < -10 && state.calDensity !== 'full'){
      setCalDensity('full');
    }
  }, { passive: true });

  let pullStartY = null, pullActive = false;
  el.addEventListener('pointerdown', (e) => {
    pullActive = el.scrollTop <= 0;
    pullStartY = e.clientY;
  }, { passive: true });
  el.addEventListener('pointermove', (e) => {
    if(!pullActive || pullStartY === null || state.calDensity === 'full') return;
    if(e.clientY - pullStartY > 50){
      setCalDensity('full');
      pullActive = false;
    }
  }, { passive: true });
  el.addEventListener('pointerup', () => { pullActive = false; pullStartY = null; }, { passive: true });
  el.addEventListener('pointercancel', () => { pullActive = false; pullStartY = null; }, { passive: true });
}

function typeLabel(type){ return t(type); }
let formPhotos = [];
let formSubtasks = [];
let formWeekdays = new Set();
let formDraft = {};

function findItem(type, id){
  const key = type === 'task' ? 'tasks' : type === 'habit' ? 'habits' : 'events';

function resetFormDraft(type, existing){
  formDraft = {
    title: existing ? existing.title : '',
    category: existing ? (existing.category || '') : '',
    description: existing ? (existing.description || '') : '',
    timeMode: existing ? (existing.timeMode || 'single') : 'single',
    date: existing ? existing.date : dateKey(state.selectedDate || today),
    endDate: existing ? (existing.endDate || existing.date) : dateKey(state.selectedDate || today),
    recurrence: {
      mode: existing ? (existing.recurrence?.mode || null) : (type === 'habit' ? 'interval' : null),
      interval: existing ? (existing.recurrence?.interval || 1) : 1
    },
    notification: {
      type: existing ? (existing.notification?.type || null) : null,
      time: existing ? (existing.notification?.time || '09:00') : '09:00',
      repeatHours: existing ? (existing.notification?.repeatHours || 1) : 1,
      text: existing ? (existing.notification?.text || '') : ''
    }
  };
  formPhotos = existing ? [...(existing.photos||[])] : [];
  formSubtasks = existing ? existing.subtasks.map(s => ({...s})) : [];
  formWeekdays = new Set(existing ? (existing.recurrence?.weekdays||[]) : []);

function openPopup(type, originEl, existing){
  state.popupOpen = true; state.popupType = type; state.navExpanded = false;
  state.editingId = existing ? existing.id : null;
  state.popupSubView = null;
  resetFormDraft(type, existing);

  const popup = document.getElementById('add-popup');
  const overlay = document.getElementById('popup-overlay');

  let originStyle = '';
  if(originEl){
    const deviceRect = document.getElementById('device').getBoundingClientRect();
    const originRect = originEl.getBoundingClientRect();
    const ox = originRect.left + originRect.width/2 - deviceRect.left;
    const oy = originRect.top + originRect.height/2 - deviceRect.top;
    originStyle = `${ox}px ${oy}px`;
  } else {
    popup.style.transformOrigin = '50% 90%';
  }

  popup.innerHTML = `
    <div class="popup-body"></div>
    <button class="pop-submit" id="popup-submit" data-action="submit-popup">${existing?t('saveChanges'):t('add') + ' ' + typeLabel(type)}</button>
  `;
  render();
  if(originStyle) popup.style.transformOrigin = originStyle;
  overlay.classList.add('show');
  requestAnimationFrame(() => popup.classList.add('show'));

  renderPopupBody();
  setTimeout(() => { if(!existing) document.getElementById('f-title')?.focus(); }, 200);
}
function closePopup(){
  state.popupOpen = false; state.editingId = null; state.popupSubView = null;
  document.getElementById('add-popup').classList.remove('show');
  document.getElementById('popup-overlay').classList.remove('show');

/* ---- subviews ---- */
function renderPopupSubView(){
  const sub = state.popupSubView;

function miniCalendarHtml(){
  const cells = monthMatrix(miniCalCursor);
  const disp = displayMonthYear(miniCalCursor);
  return `
    <div class="cal-topbar" style="margin-bottom:10px;">
      <div class="cal-corner-arrow left" data-action="mini-cal-prev">${ICONS.chevronLeft}</div>
      <span class="cal-label" style="font-size:16px; min-width:0;">${disp.monthLabel} ${disp.yearLabel}</span>
      <div class="cal-corner-arrow right" data-action="mini-cal-next">${ICONS.chevronRight}</div>
    </div>
    <div class="mini-cal-weekday">${weekdayOrder().map(i=>`<span>${weekdayShort(i)}</span>`).join('')}</div>
    <div class="mini-cal-grid" id="mini-cal-grid">${cells.map(d => miniCalCellHtml(d)).join('')}</div>
    <div class="mini-cal-hint">${t('tapOrDrag')}</div>
  `;
}
function miniCalCellHtml(d){
  const inMonth = cellInCurrentMonth(d, miniCalCursor);
  const key = dateKey(d);
  let rangeClass = '';
  if(formDraft.timeMode === 'range'){
    if(key === formDraft.date && key === formDraft.endDate) rangeClass = 'range-single';
    else if(key === formDraft.date) rangeClass = 'range-start';
    else if(key === formDraft.endDate) rangeClass = 'range-end';
    else if(key > formDraft.date && key < formDraft.endDate) rangeClass = 'in-range';
  } else if(key === formDraft.date){
    rangeClass = 'range-single';
  }
  return `<div class="mini-cal-cell ${inMonth?'':'other-month'} ${rangeClass}" data-date="${key}">${displayDayNum(d)}</div>`;
}
function refreshMiniCalGrid(){
  const grid = document.getElementById('mini-cal-grid');
  if(!grid) return;
  grid.innerHTML = monthMatrix(miniCalCursor).map(d => miniCalCellHtml(d)).join('');
  attachMiniCalGesture();
}
function attachMiniCalGesture(){
  const grid = document.getElementById('mini-cal-grid');
  if(!grid) return;
  let dragStartKey = null, dragging = false;
  grid.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.mini-cal-cell');
    if(!cell) return;
    dragStartKey = cell.dataset.date; dragging = true;
    formDraft.timeMode = 'single'; formDraft.date = dragStartKey; formDraft.endDate = dragStartKey;
    refreshMiniCalGrid();
    e.stopPropagation();
  });
  grid.addEventListener('pointermove', e => {
    if(!dragging) return;
    const cell = e.target.closest('.mini-cal-cell');
    if(!cell) return;
    const key = cell.dataset.date;
    if(key === dragStartKey) return;
    formDraft.timeMode = 'range';
    if(key < dragStartKey){ formDraft.date = key; formDraft.endDate = dragStartKey; }
    else { formDraft.date = dragStartKey; formDraft.endDate = key; }
    refreshMiniCalGrid();
  });
  const end = () => { dragging = false; };
  grid.addEventListener('pointerup', end);
  grid.addEventListener('pointercancel', end);
}
function repeatSubviewHtml(type){
  const mode = formDraft.recurrence.mode;
  const options = type === 'habit' ? ['interval','weekdays'] : ['none','interval','weekdays'];
  const labelMap = { none:t('noRepeat'), interval:t('everyNDays'), weekdays:t('specificDays') };
  return `
    <div class="toggle-pair" id="rec-mode-toggle">
      ${options.map(o => `<button type="button" data-rec="${o}" class="${(mode===o || (o==='none' && !mode)) ? 'active':''}">${labelMap[o]}</button>`).join('')}

    <div id="rec-interval-panel" class="${mode==='interval'?'':'hidden'}" style="margin-top:10px;">
      <input type="number" id="f-interval" min="1" max="7" value="${formDraft.recurrence.interval}" placeholder="${t('repeatEveryDays')}">
    </div>
    <div id="rec-weekdays-panel" class="${mode==='weekdays'?'':'hidden'}" style="margin-top:10px;">
      <div class="weekday-picker">${weekdayOrder().map(i => `<button type="button" data-wd="${i}" class="${formWeekdays.has(i)?'active':''}">${weekdayShort(i)}</button>`).join('')}</div>

}

/* ---- master body renderer + wiring ---- */
function renderPopupBody(){
  const body = document.querySelector('#add-popup .popup-body');
  if(!body) return;
  if(state.popupSubView){
    body.innerHTML = renderPopupSubView();
    wireSubviewInteractivity();
    return;
  }
  body.innerHTML = `
    <div class="float-field"><input type="text" id="f-title" placeholder=" " value="${escapeAttr(formDraft.title)}" autocomplete="off"><label>${t('titleLabel')}</label></div>
    ${state.popupType === 'task' ? subtasksBlock() : ''}
    ${formBody(state.popupType)}
  `;
  wireMainFormInteractivity();
  const titleInput = document.getElementById('f-title');
  const submitBtn = document.getElementById('popup-submit');
  submitBtn.classList.toggle('visible', titleInput.value.trim().length > 0);
  titleInput.addEventListener('input', () => {
    formDraft.title = titleInput.value;
    submitBtn.classList.toggle('visible', titleInput.value.trim().length > 0);
  });
}
function wireMainFormInteractivity(){
  document.getElementById('f-category')?.addEventListener('input', e => { formDraft.category = e.target.value; });
  document.getElementById('f-description')?.addEventListener('input', e => { formDraft.description = e.target.value; });
  document.getElementById('desc-clip-btn')?.addEventListener('click', () => document.getElementById('f-photo-input').click());
  document.getElementById('f-photo-input')?.addEventListener('change', (e) => {
    const files = Array.from(e.target.files).slice(0, 3 - formPhotos.length);
    let remaining = files.length;
    if(remaining === 0) return;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => { formPhotos.push(reader.result); remaining--; if(remaining===0) renderPopupBody(); };
      reader.readAsDataURL(file);
    });
  });
  document.querySelectorAll('[data-rmphoto]').forEach(b => b.addEventListener('click', () => { formPhotos.splice(Number(b.dataset.rmphoto),1); renderPopupBody(); }));
  document.getElementById('add-subtask-btn')?.addEventListener('click', () => { if(formSubtasks.length>=3) return; formSubtasks.push({id:uid(), text:'', done:false}); renderPopupBody(); });
  document.querySelectorAll('[data-rmsubtask]').forEach(b => b.addEventListener('click', () => { formSubtasks.splice(Number(b.dataset.rmsubtask),1); renderPopupBody(); }));
  document.querySelectorAll('[data-subidx]').forEach(inp => inp.addEventListener('input', e => { formSubtasks[Number(e.target.dataset.subidx)].text = e.target.value; }));
}
function wireSubviewInteractivity(){
  const sub = state.popupSubView;
  if(sub === 'calendar'){
    attachMiniCalGesture();
  } else if(sub === 'repeat'){
    document.querySelectorAll('#rec-mode-toggle button').forEach(b => b.addEventListener('click', () => {
      formDraft.recurrence.mode = b.dataset.rec === 'none' ? null : b.dataset.rec;
      renderPopupBody();
    }));
    document.getElementById('f-interval')?.addEventListener('input', e => { formDraft.recurrence.interval = Number(e.target.value||1); });
    document.querySelectorAll('.weekday-picker button').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.wd);
      if(formWeekdays.has(i)){ formWeekdays.delete(i); b.classList.remove('active'); } else { formWeekdays.add(i); b.classList.add('active'); }
    }));
  } else if(sub === 'notification'){
    document.querySelectorAll('#notif-mode-toggle button').forEach(b => b.addEventListener('click', () => {
      formDraft.notification.type = b.dataset.notif === 'none' ? null : b.dataset.notif;
      renderPopupBody();
    }));
    document.getElementById('f-notif-time')?.addEventListener('input', e => { formDraft.notification.time = e.target.value; });
    document.getElementById('f-notif-hours')?.addEventListener('input', e => { formDraft.notification.repeatHours = Number(e.target.value||1); });
    document.getElementById('f-notif-text')?.addEventListener('input', e => { formDraft.notification.text = e.target.value; });
  }
}

function submitPopup(){
  const title = (formDraft.title||'').trim();
  if(!title) return;
  const type = state.popupType;
  const recurrence = { mode: formDraft.recurrence.mode, interval: formDraft.recurrence.interval, weekdays: Array.from(formWeekdays) };
  const notification = { ...formDraft.notification };
  if(type === 'task'){
    const obj = {
      id: state.editingId || uid(),
      title,
      category: (formDraft.category||'').trim(),

      photos: [...formPhotos],

      timeMode: formDraft.timeMode,
      date: formDraft.date,
      endDate: formDraft.timeMode==='range' ? formDraft.endDate : null,
      recurrence, notification
    };
    upsert('tasks', obj);
  } else if(type === 'habit'){
    const obj = {
      id: state.editingId || uid(),
      title,
      recurrence, notification,
      startDate: state.editingId ? findItem('habit', state.editingId).startDate : dateKey(today),
      completedDates: state.editingId ? findItem('habit', state.editingId).completedDates : []
    };
    upsert('habits', obj);
  } else if(type === 'event'){
    const obj = {
      id: state.editingId || uid(),
      title,
      timeMode: formDraft.timeMode,
      date: formDraft.date,
      endDate: formDraft.timeMode==='range' ? formDraft.endDate : null,
      recurrence, notification
    };
    upsert('events', obj);
  }
  closePopup();
  render();
}
const CLOUD_SAVE_BY_ARRKEY = { tasks: Cloud.saveTask, habits: Cloud.saveHabit, events: Cloud.saveEvent };
function upsert(arrKey, obj){
  const arr = state[arrKey];
  const idx = arr.findIndex(x => x.id === obj.id);
  if(idx >= 0) arr[idx] = obj; else arr.push(obj);
  CLOUD_SAVE_BY_ARRKEY[arrKey](obj).catch(()=>{});
}

/* role="checkbox" divs (task/habit toggles) have no native Enter/Space
   activation the way a <button> would, so wire it up manually. They can't
   be real <button>s because each one nests the qs-done/qs-undone quickset
   buttons, and a <button> can't contain interactive children. */
document.getElementById('device').addEventListener('keydown', (e) => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const cb = e.target.closest('[role="checkbox"]');
  if(!cb) return;
  e.preventDefault();
  cb.click();
});

function shiftWeek(dir){ state.calCursor = addDays(state.calCursor, 7*dir); render(); }
function shiftDay(dir){ state.calCursor = addDays(state.calCursor, dir); render(); }

/* Desktop-only: trackpad horizontal swipe over the calendar grid moves
   to the previous/next day, week or month depending on the active tab —
   same debounced deltaX-dominant pattern as the Home widget's version. */
function initCalendarWheelSwipe(){
  const el = document.getElementById('page-calendar');
  if(!el) return;
  let lastWheelNav = 0;
  el.addEventListener('wheel', (e) => {
    if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    if(Math.abs(e.deltaX) < 30 || Date.now() - lastWheelNav < 400) return;
    lastWheelNav = Date.now();
    const dir = e.deltaX > 0 ? 1 : -1;
    if(state.calMode === 'month') shiftMonthRoll(dir);
    else if(state.calMode === 'week') shiftWeek(dir);
    else shiftDay(dir);
  }, { passive: true });
}

/* Holding a checkbox (task or habit) reveals a small DONE/UNDONE popover
   next to it — an explicit alternative to the normal tap-to-toggle,
   separate from the row's own swipe-to-delete gesture. Delegated once on
   #device (not per-row) so it keeps working after the scoped DOM patches
   in the toggle-task/habit handlers, which never re-render the row. */
/* markSkipped is only ever true from the quickset's UNDONE button — an
   explicit "not done" (red X + strikethrough), distinct from the plain
   tap-to-toggle empty state. The three states this gives a task/habit:
   done, explicitly-not-done, and (via swipe) deleted. */
function applyQuicksetState(cb, wantDone, markSkipped){
  const action = cb.dataset.action;
  const isSkipped = !!markSkipped && !wantDone;
  let isDone;
  if(action === 'toggle-task'){
    const item = state.tasks.find(x => x.id === cb.dataset.id);
    if(!item) return;
    item.done = wantDone; item.skipped = isSkipped; isDone = wantDone;
    Cloud.saveTask(item).catch(()=>{});
  } else if(action === 'toggle-habit'){
    const item = state.habits.find(x => x.id === cb.dataset.id);
    if(!item) return;
    const dk = cb.dataset.date;
    const i = item.completedDates.indexOf(dk);
    if(wantDone && i < 0) item.completedDates.push(dk);
    else if(!wantDone && i >= 0) item.completedDates.splice(i, 1);
    item.skippedDates = item.skippedDates || [];
    const si = item.skippedDates.indexOf(dk);
    if(isSkipped && si < 0) item.skippedDates.push(dk);
    else if(!isSkipped && si >= 0) item.skippedDates.splice(si, 1);
    isDone = wantDone;
    Cloud.saveHabit(item).catch(()=>{});
  } else return;
  cb.classList.toggle('checked', isDone);
  cb.classList.toggle('skipped', isSkipped);
  cb.setAttribute('aria-checked', isDone);
  const qs = cb.querySelector('.checkbox-quickset');
  qs?.classList.remove('show'); // always closes the popover, even when set via a qs button
  cb.innerHTML = (isDone ? ICONS.check : isSkipped ? ICONS.close : '') + (qs ? qs.outerHTML : '');
  cb.closest('.item-card')?.classList.toggle('done', isDone);
  cb.closest('.item-card')?.classList.toggle('skipped', isSkipped);
  updateDayStatsInPlace();
}
function attachCheckboxLongPress(){
  const root = document.getElementById('device');
  if(!root) return;
  let timer = null, startX = 0, startY = 0;
  const closeAllQuicksets = () => {
    document.querySelectorAll('.checkbox-quickset.show').forEach(el => el.classList.remove('show'));
  };
  root.addEventListener('pointerdown', e => {
    const cb = e.target.closest('.checkbox[data-action]');
    if(!cb){ closeAllQuicksets(); return; }
    if(e.target.closest('.checkbox-quickset')) return;
    startX = e.clientX; startY = e.clientY;
    e.stopPropagation(); // keep the row's own swipe-to-delete from tracking this drag
    timer = setTimeout(() => {
      timer = null;
      closeAllQuicksets();
      cb.dataset.suppressClick = '1';
      cb.querySelector('.checkbox-quickset')?.classList.add('show');
      if(navigator.vibrate) navigator.vibrate(12);
    }, 450);
  }, true);
  root.addEventListener('pointermove', e => {
    if(!timer) return;
    if(Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8){ clearTimeout(timer); timer = null; }
  }, true);
  root.addEventListener('pointerup', () => { clearTimeout(timer); timer = null; }, true);
  root.addEventListener('pointercancel', () => { clearTimeout(timer); timer = null; }, true);
  root.addEventListener('click', e => {
    const qsBtn = e.target.closest('[data-qs]');
    if(qsBtn){
      e.stopPropagation();
      const cb = qsBtn.closest('.checkbox');
      if(cb) applyQuicksetState(cb, qsBtn.dataset.qs === 'done', true);
      return;
    }
    const cb = e.target.closest('.checkbox[data-action]');
    if(cb && cb.dataset.suppressClick){
      delete cb.dataset.suppressClick;
      e.stopPropagation();
      return; // the long-press already opened the popover; swallow this tap
    }
    closeAllQuicksets();
  }, true);
}

function doLogout(){
  Cloud.signOut();
  state.authScreen = true;
  state.authTab = 'login';
  state.menuSubView = null;
  state.tasks = []; state.habits = []; state.events = [];
  render();
}
/* Press-and-hold (3s) instead of a plain tap for the logout button —
   the fill/color CSS transitions (.holding class, see .logout-hold-*
   rules) are purely visual; this is what actually drives the timing and
   calls doLogout() once the hold completes. Releasing early (pointerup/
   leave/cancel) before 3s just resets the fill via the 'holding' class
   transitioning back to scale(0) — no separate "cancel" animation
   needed, the same transition runs in reverse. */
function attachLogoutHold(){
  const root = document.getElementById('device');
  if(!root) return;
  let timer = null, firedByHold = false;
  const press = e => {
    const btn = e.target.closest('.logout-hold-btn');
    if(!btn) return;
    btn.classList.add('holding');
    timer = setTimeout(() => {
      timer = null;
      firedByHold = true; // the click the browser fires right after this pointerup must not also show the toast
      doLogout();
    }, 3000);
  };
  const release = () => {
    if(timer){ clearTimeout(timer); timer = null; }
    document.querySelectorAll('.logout-hold-btn.holding').forEach(b => b.classList.remove('holding'));
  };
  root.addEventListener('pointerdown', press);
  root.addEventListener('pointerup', release);
  root.addEventListener('pointercancel', release);
  root.addEventListener('pointerleave', release, true);
  root.addEventListener('click', e => {
    if(!firedByHold) return;

/* ============ DESKTOP: right-click context menu for task/habit rows ======
   Mouse equivalent of the mobile long-press quickset, plus Edit/Delete
   which that popover has no room for. Mobile has no reliable right-click,
   so this only arms at >=960px. */
function closeRowContextMenu(){ document.getElementById('row-context-menu')?.remove(); }
function showRowContextMenu(x, y, type, id, wrap){
  closeRowContextMenu();
  const menu = document.createElement('div');
  menu.id = 'row-context-menu';
  menu.className = 'row-context-menu';
  menu.innerHTML = `
    <button type="button" data-ctx="done">${ICONS.check}${t('qsDone')}</button>
    <button type="button" data-ctx="undone">${ICONS.close}${t('qsUndone')}</button>
    <button type="button" data-ctx="edit">${ICONS.pencilIcon}${t('editBtn')}</button>
    <button type="button" data-ctx="delete" class="danger">${ICONS.trash}${t('deleteBtn')}</button>
  `;
  document.body.appendChild(menu);
  // Clamp so it never renders off the right/bottom edge of the viewport.
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
  menu.addEventListener('click', e => {
    const btn = e.target.closest('[data-ctx]');
    if(!btn) return;
    e.stopPropagation();

    if(action === 'done' && cb) applyQuicksetState(cb, true);
    else if(action === 'undone' && cb) applyQuicksetState(cb, false, true);
    else if(action === 'edit') openPopup(type, wrap, findItem(type, id));
    else if(action === 'delete'){
      if(type === 'task') state.tasks = state.tasks.filter(x => x.id !== id);
      if(type === 'habit') state.habits = state.habits.filter(x => x.id !== id);
      render();
    }
    closeRowContextMenu();
  });
}
function attachDesktopContextMenu(){
  const root = document.getElementById('device');
  root.addEventListener('contextmenu', e => {
    if(window.innerWidth < 960) return;
    const wrap = e.target.closest('.swipe-wrap[data-swipe-type]');

/* ============ CALENDAR GESTURES: swipe-to-roll month/year, pinch to zoom ============ */
/* "اسکرول درجا" — scroll/touch-driven density morph for the month grid,
   phone-only (ported in spirit, not in code, from calendar09.html's
   feed()/setMode state machine: a gesture-to-state-machine mapping with
   hysteresis, not real page scrolling or CSS scroll-snap). Re-themed to
   this app's own .month-grid/.day-cell markup rather than the
   reference's. */
const CAL_DENSITY_ORDER = ['full','mid','compact'];
/* `el` is the gesture surface (the month grid); `scopeEl` is the page
   container the data-density attribute is set on, so CSS can also
   shrink siblings of the grid (weekday header, month/year title) —
   matching the reference's broader "hide .goto, shrink title, hide nav
   arrows, shrink .occwrap" compaction, not just the grid itself. Also
   calls preventDefault on the wheel/touch handlers so this gesture
   exclusively drives density instead of fighting with the page's own
   vertical scroll underneath it, the way the reference's gesture was
   the only thing listening (it wasn't embedded in a taller scrolling
   page the way this app's calendar/home pages are). */
/* Resets density back to "full" when the viewport crosses the phone/
   desktop breakpoint, so a resize (or a device rotation) doesn't leave
   a compacted grid stuck on a layout that no longer needs it. */
if(!window.__densityBreakpointWatcher){
  window.__densityBreakpointWatcher = true;
  window.matchMedia('(min-width:768px)').addEventListener('change', () => {
    state.calDensity = 'full';
    render();
  });
}
/* Horizontal wheel/trackpad scroll over the month grid steps the month,
   matching the arrow buttons' own right=previous/left=next convention —
   scrolling "right" (deltaX>0) goes back, "left" (deltaX<0) goes
   forward. Vertical scroll is left alone here (handled separately by
   attachDensityGesture on mobile); only fires when the gesture is
   clearly horizontal, so a vertical density scroll never also steps
   the month by accident. Wheel-only (not touch) — the desktop grid has
   no touch surface of its own, and the mobile home widget already has
   its own horizontal touch-drag via attachHomeCalDrag(). */
function attachCalWheelMonthNav(el, stepFn){
  if(!el) return;
  let settling = false;
  el.addEventListener('wheel', e => {
    if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    e.stopPropagation(); // don't also let it bubble into #page-home's own deltaX-dominant day-nav handler
    if(settling) return;
    settling = true;
    stepFn(e.deltaX > 0 ? -1 : 1);
    setTimeout(() => { settling = false; }, 350);
  }, { passive:false });
}
function attachDensityGesture(el, scopeEl){
  if(!el || !scopeEl) return;
  if(window.innerWidth >= 768){ scopeEl.removeAttribute('data-density'); return; }
  if(!state.calDensity) state.calDensity = 'full';
  scopeEl.setAttribute('data-density', state.calDensity);
  // A sheet/dropdown open over the grid shouldn't also be eating the
  // same scroll/touch gesture to change density underneath it.
  const blocked = () => state.monthDropdownOpen || state.yearDropdownOpen || state.daySheetOpen;
  let acc = 0;
  const step = (dir) => {
    const i = CAL_DENSITY_ORDER.indexOf(state.calDensity);
    const next = i + dir;
    if(next < 0 || next > 2) return;
    state.calDensity = CAL_DENSITY_ORDER[next];
    acc = 0;
    scopeEl.classList.add('density-fade');
    scopeEl.setAttribute('data-density', state.calDensity);
    setTimeout(() => scopeEl.classList.remove('density-fade'), 180);
    positionHomeCalGrid();
  };
  const feed = (dy) => {
    acc = Math.max(0, Math.min(200, acc + Math.abs(dy)));
    const i = CAL_DENSITY_ORDER.indexOf(state.calDensity);
    if(dy > 0 && acc > (i === 0 ? 40 : 140)) step(1);
    else if(dy < 0 && acc > (i === 2 ? 15 : 115)) step(-1);
  };
  /* Wheel deltaY and touch's own dy (touchY-y, below) are opposite in
     sign for the same physical "scroll up" gesture — a wheel scrolled
     up is a *negative* deltaY by browser convention, while touch's dy
     is already positive on an upward drag. Negate deltaY here so both
     funnel into feed() with the same meaning: positive = scroll up =
     step forward (full → 2 weeks → 1 week), matching the touch gesture
     and the request this was built for. stopPropagation on both is
     required, not optional — without it the event bubbles up to
     #page-home's own pull-to-expand wheel/touch listeners
     (initHomeScrollExpand), which read the very same gesture and
     immediately stomp whatever density this just set. */
  el.addEventListener('wheel', e => { if(!blocked() && Math.abs(e.deltaY) > 1 && Math.abs(e.deltaY) > Math.abs(e.deltaX)){ e.preventDefault(); e.stopPropagation(); feed(-e.deltaY); } }, {passive:false});
  let touchY = null;
  el.addEventListener('touchstart', e => { touchY = blocked() ? null : e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchmove', e => {
    if(touchY === null) return;
    e.preventDefault();
    e.stopPropagation();
    const y = e.touches[0].clientY;
    feed(touchY - y);
    touchY = y;
  }, {passive:false});
  el.addEventListener('touchend', () => { touchY = null; acc = 0; });
}
/* Day-cell tap / long-press state machine: a plain tap on an in-month
   cell selects it (same as the old pick-day/pick-home-day click action
   it replaces); a tap on an out-of-month cell instead jumps the view to
   that day's month; a ~500ms hold vibrates and opens the day detail
   (desktop day-sheet for the main calendar grid). Pointer events only,
   so it doesn't collide with attachDensityGesture()'s separate wheel/
   touch listeners on the same grid element. */
function attachDayCellGestures(gridEl, isHome){
  if(!gridEl) return;
  let pressEl = null, timer = null, startX = 0, startY = 0, longFired = false, moved = false;
  const clearPress = () => {
    if(timer){ clearTimeout(timer); timer = null; }
    if(pressEl){ pressEl.classList.remove('press'); pressEl = null; }
  };
  gridEl.addEventListener('pointerdown', e => {
    const btn = e.target.closest('.day-cell');
    if(!btn) return;
    pressEl = btn; startX = e.clientX; startY = e.clientY; moved = false; longFired = false;
    btn.classList.add('press');
    timer = setTimeout(() => {
      longFired = true;
      btn.classList.remove('press');
      try{ navigator.vibrate && navigator.vibrate(15); }catch(err){}
      const d = new Date(btn.dataset.date);
      state.selectedDate = d;
      state.homeDate = d;
      if(!isHome){ state.daySheetDate = d; state.daySheetOpen = true; }
      render();
    }, 500);
  });
  gridEl.addEventListener('pointermove', e => {
    if(!pressEl) return;
    if(Math.hypot(e.clientX - startX, e.clientY - startY) > 10){ moved = true; clearPress(); }
  });
  gridEl.addEventListener('pointerup', () => {
    if(!pressEl) return;
    const btn = pressEl;
    clearPress();
    if(longFired || moved) return;
    const d = new Date(btn.dataset.date);
    if(btn.classList.contains('other-month')){
      if(isHome) state.homeDate = d; else state.calCursor = d;
    } else {
      state.selectedDate = d;
      state.homeDate = d;
    }
    render();
  });
  gridEl.addEventListener('pointercancel', clearPress);
  gridEl.addEventListener('contextmenu', e => e.preventDefault());
}
/* Keeps the month/year dropdowns from spilling past their card's edges
   on narrow screens (they're centered under the topbar by default,
   which can overflow when the label sits near the card's left/right
   edge). */
function clampDropdowns(){
  ['month-dropdown','year-dropdown','home-month-dropdown','home-year-dropdown','sec-month-dropdown','sec-year-dropdown','home-sec-month-dropdown','home-sec-year-dropdown'].forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    el.style.transform = 'translateX(-50%)';
    const card = el.closest('.desktop-box') || el.closest('.card') || el.parentElement;
    const bounds = card.getBoundingClientRect();
    const rect = el.getBoundingClientRect();
    const pad = 8;
    let shift = 0;
    if(rect.left < bounds.left + pad) shift = (bounds.left + pad) - rect.left;
    else if(rect.right > bounds.right - pad) shift = (bounds.right - pad) - rect.right;
    if(shift) el.style.transform = `translateX(calc(-50% + ${shift}px))`;
  });
}
/* Scrolls the currently-selected year to the center of the year-list
   dropdown when it opens, instead of leaving the list at its native
   top-scroll position (which can bury the current year many rows down). */
function scrollYearDropdownActive(){

    const el = document.getElementById(id);

    if(active) active.scrollIntoView({ block:'center' });
  });
}
function attachCalendarGestures(){

function attachRollGesture(el, onChange){
  if(!el) return;
  let startY = null, startX = null, moved = false;
  el.addEventListener('pointerdown', e => { startY = e.clientY; startX = e.clientX; moved = false; e.stopPropagation(); });
  el.addEventListener('pointermove', e => {
    if(startY === null) return;
    if(Math.abs(e.clientY - startY) > 8 || Math.abs(e.clientX - startX) > 8) moved = true;
  });
  el.addEventListener('pointerup', e => {

    const dy = e.clientY - startY;

function rollOut(el, dir, cb){

/* ============ SWIPE TO DELETE (task / habit rows) ============ */
function attachSwipeToDelete(container){
  if(!container) return;
  container.querySelectorAll('.swipe-wrap').forEach(wrap => {
    const fg = wrap.querySelector('.item-card');
    if(!fg) return;
    let startX=null, startY=null, dx=0, dragging=false, decided=false, isHorizontal=false;
    fg.addEventListener('pointerdown', e => {
      startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; decided = false; isHorizontal = false;
      fg.style.transition = 'none';
      /* No stopPropagation() here (unconditional, like before) — that
         swallowed every pointerdown starting on a card, including the
         ones meant for #page-home's own pull-to-expand-calendar gesture
         (initHomeScrollExpand), which listens on the page itself and
         never saw them. Only stop it once a drag is confirmed
         horizontal, below. */
    });
    const bg = wrap.querySelector('.swipe-delete-bg');
    fg.addEventListener('pointermove', e => {
      if(!dragging) return;
      const ddx = e.clientX - startX;
      const ddy = e.clientY - startY;
      if(!decided && (Math.abs(ddx) > 6 || Math.abs(ddy) > 6)){
        decided = true;
        isHorizontal = Math.abs(ddx) > Math.abs(ddy);
      }
      if(!isHorizontal) return;
      e.stopPropagation();
      dx = ddx;
      fg.style.transform = `translateX(${dx}px)`;
      /* Swiping toward screen-left previews "mark done" (green check);
         toward screen-right previews delete (red trash) — only swaps
         once the drag has a real direction, so a tiny jitter at
         pointerdown doesn't flash the wrong one. */
      if(bg && Math.abs(dx) > 4){
        bg.classList.toggle('swipe-bg-done', dx < 0);
        bg.innerHTML = dx < 0 ? ICONS.check : ICONS.trash;
      }
    });
    const end = () => {
      if(!dragging) return;
      dragging = false;
      fg.style.transition = 'transform .22s ease';
      const type = wrap.dataset.swipeType, id = wrap.dataset.swipeId;
      if(isHorizontal && Math.abs(dx) > 60){
        if(dx < 0){
          /* Swipe left: toggle done in place, same as tapping the
             checkbox — the row snaps back, it doesn't disappear. */
          fg.style.transform = 'translateX(0)';
          const cb = wrap.querySelector('.checkbox[data-action]');
          if(cb) applyQuicksetState(cb, !cb.classList.contains('checked'));
        } else {
          /* Swipe right: delete, sliding the rest of the way off. */
          fg.style.transform = 'translateX(100%)';
          fg.style.opacity = '0';
          setTimeout(() => {
            if(type === 'task'){ state.tasks = state.tasks.filter(x=>x.id!==id); Cloud.deleteTask(id).catch(()=>{}); }
            if(type === 'habit'){ state.habits = state.habits.filter(x=>x.id!==id); Cloud.deleteHabit(id).catch(()=>{}); }
            render();
          }, 190);
        }
      } else {
        fg.style.transform = 'translateX(0)';
      }
      if(bg){ bg.classList.remove('swipe-bg-done'); bg.innerHTML = ICONS.trash; }
    };
    fg.addEventListener('pointerup', end);
    fg.addEventListener('pointercancel', end);
  });
  container.querySelectorAll('.events-scroll').forEach(el => {
    el.addEventListener('pointerdown', e => e.stopPropagation());
  });
}
function attachHomeCalDrag(){
  const handle = document.getElementById('home-cal-handle');
  const surface = document.getElementById('home-cal-grid-clip');
  let startX = null, startY = null, moved = false;

  function onDown(e){ startX = e.clientX; startY = e.clientY; moved = false; }
  function onMove(e){
    if(startY === null) return;
    if(Math.abs(e.clientY - startY) > 8 || Math.abs(e.clientX - startX) > 8) moved = true;
  }
  function onUp(e, isHandle){
    if(startY === null) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(moved && Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)){
      // Horizontal: previous/next week (collapsed) or month (expanded),
      // with a slide in the swipe's own direction instead of an instant
      // date swap. RTL-agnostic on purpose (app stays LTR always) — left
      // swipe = forward.
      const dir = dx < 0 ? 1 : -1;
      slideHomeCalDate(dir, () => {
        state.homeDate = state.calDensity === 'full' ? stepMonth(state.homeDate, dir) : addDays(state.homeDate, dir*7);
      });
      startY = null;
      return;
    } else if(moved && Math.abs(dy) > 24){
      setCalDensity(dy > 0 ? 'full' : 'compact');
    } else if(!moved && isHandle){
      setCalDensity(state.calDensity === 'full' ? 'compact' : 'full');
    }
    startY = null;
  }

  if(handle){
    handle.addEventListener('pointerdown', e => { onDown(e); e.stopPropagation(); });
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', e => onUp(e, true));
  }
  if(surface){
    surface.addEventListener('pointerdown', onDown);
    surface.addEventListener('pointermove', onMove);
    surface.addEventListener('pointerup', e => onUp(e, false));
    // a real drag (moved) shouldn't also register as a day pick
    surface.addEventListener('click', e => { if(moved) e.stopPropagation(); });
  }
}

/* Slides the calendar grid out in the swipe's direction, applies the
   date change, then slides the new grid in from the opposite side —
   independent of #home-cal-grid's own translateY (expand/collapse), so
   the two animations never fight each other. */
function slideHomeCalDate(dir, updateFn){
  const slide = document.getElementById('home-cal-slide');
  if(!slide){ updateFn(); render(); return; }
  slide.style.transition = 'transform .16s ease, opacity .16s ease';
  slide.style.transform = `translateX(${dir > 0 ? '-28px' : '28px'})`;
  slide.style.opacity = '0';
  setTimeout(() => {
    updateFn();
    render();
    const s2 = document.getElementById('home-cal-slide');
    if(!s2) return;
    s2.style.transition = 'none';
    s2.style.transform = `translateX(${dir > 0 ? '28px' : '-28px'})`;
    s2.style.opacity = '0';
    requestAnimationFrame(() => {
      s2.style.transition = 'transform .2s cubic-bezier(.4,0,.2,1), opacity .2s ease';
      s2.style.transform = 'translateX(0)';
      s2.style.opacity = '1';
    });
  }, 150);
}

/* Expanding/collapsing the widget never changes which date is selected
   or the grid's content (the month grid is always fully rendered — only
   positionHomeCalGrid()'s clip-height/translateY decide how much of it
   shows), so it never needed to re-render anything at all. It used to
   replace the whole widget via outerHTML "to be safe", but that's what
   caused the resize to look sudden instead of smooth: a freshly-inserted
   node has no prior height for the CSS transition to animate FROM, so
   the browser just jumps straight to the target size. Updating state and
   calling positionHomeCalGrid() on the SAME, already-transitioning DOM
   node is what makes the grow/shrink animate properly — and also avoids
   re-attaching gesture listeners onto elements that never went away. */
function setCalDensity(density){
  state.calDensity = density;
  const widget = document.getElementById('home-cal-widget');
  const scopeEl = document.getElementById('page-home');
  if(scopeEl) scopeEl.setAttribute('data-density', density);
  if(!widget){ render(); return; }
  positionHomeCalGrid();
}

/* Sizes/positions the merged widget's month grid so only a window of
   rows around state.homeDate shows, driven by state.calDensity (the
   same full/mid/compact stages attachDensityGesture's scroll/touch
   feed already steps through): full = all weeks, mid = a 2-week
   window, compact = just the one week containing homeDate — all via
   the same transform/height technique, so stepping between stages is
   a smooth animation instead of a content swap. */
let homeCalFirstPosition = true;
function positionHomeCalGrid(){
  const clip = document.getElementById('home-cal-grid-clip');
  const grid = document.getElementById('home-cal-grid');
  if(!clip || !grid || !grid.children.length) return;
  const rowGap = 4;
  const rowH = grid.children[0].getBoundingClientRect().height;
  if(!rowH) return;
  const totalRows = Math.ceil(grid.children.length / 7);
  const key = dateKey(state.homeDate);
  let rowIndex = 0;
  for(let i = 0; i < grid.children.length; i++){
    if(grid.children[i].dataset.date === key){ rowIndex = Math.floor(i / 7); break; }
  }
  const density = state.calDensity || 'full';
  const visibleRows = density === 'compact' ? 1 : density === 'mid' ? Math.min(2, totalRows) : totalRows;
  // The window always starts at the row containing homeDate, except
  // near the bottom of the grid where it instead ends there, so a
  // 2-row (or 1-row) window never runs off the end of the month.
  const startRow = Math.max(0, Math.min(rowIndex, totalRows - visibleRows));
  const visibleHeight = visibleRows * rowH + Math.max(0, visibleRows - 1) * rowGap;

  if(homeCalFirstPosition){ clip.style.transition = 'none'; grid.style.transition = 'none'; }
  clip.style.height = visibleHeight + 'px';
  grid.style.transform = `translateY(-${startRow * (rowH + rowGap)}px)`;
  if(homeCalFirstPosition){
    requestAnimationFrame(() => {
      clip.style.transition = '';
      grid.style.transition = '';
      homeCalFirstPosition = false;
    });
  }
}

function attachDaySheetDrag(){
  const sheet = document.getElementById('day-sheet');
  const handle = sheet.querySelector('.sheet-handle');
  const header = sheet.querySelector('.sheet-header');
  [handle, header].forEach(el => {
    if(!el) return;
    let startY = null, dragging = false;
    el.addEventListener('pointerdown', e => { startY = e.clientY; dragging = true; sheet.style.transition = 'none'; });
    el.addEventListener('pointermove', e => {
      if(!dragging) return;
      const dy = startY - e.clientY;
      if(dy > 0) sheet.style.transform = `translateY(${-Math.min(dy, 220)}px)`;
    });
    const end = (e) => {
      if(!dragging) return;
      dragging = false;
      sheet.style.transition = 'transform .25s ease';
      const dy = startY - (e.clientY ?? startY);
      sheet.style.transform = '';
      if(dy > 70){
        state.homeDate = new Date(state.daySheetDate);
        state.daySheetOpen = false;
        render();
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => { dragging = false; sheet.style.transition = 'transform .25s ease'; sheet.style.transform = ''; });
  });
}

/* ============ INIT ============ */
initFabAndMenuInteractions();
initHomeScrollExpand();
initCalendarWheelSwipe();
attachCheckboxLongPress();
attachDesktopContextMenu();
attachDaySheetDrag();
attachLogoutHold();

/* updateNav() measures real element positions (rail bottom edge, calendar
   box edges, etc.) and writes them as inline styles — nothing else
   re-runs that measurement when the viewport changes (resizing the
   window, or a late font swap reflowing layout after boot), so those
   positions go stale until the next click-driven render(). Debounced
   since resize fires continuously while dragging. */
let navResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(navResizeTimer);
  navResizeTimer = setTimeout(updateNav, 120);
});

async function loadFromCloud(){
  const data = await Cloud.loadAll();
  state.profile = Object.assign({}, state.profile, data.profile);
  syncProfileName();
  state.settings = Object.assign({}, state.settings, data.settings);
  state.tasks = data.tasks;
  state.habits = data.habits;
  state.events = data.events;
}
let sessionJustExpired = false; // set true for the duration of a boot() that onSessionExpired fired during
Cloud.onSessionExpired = () => {
  sessionJustExpired = true;
  state.authScreen = true;
  state.authTab = 'login';
  state.tasks = []; state.habits = []; state.events = [];
  render();
  showToast(t('sessionExpired'));
};

/* Temporarily disabled at the repo owner's request (2026-10-09) so the
   desktop-rail/profile rework can be checked without a real account —
   flip back to false to restore real Supabase login. Skips straight past
   the auth screen into the local placeholder profile/data already in
   `state` above; no cloud calls happen while this is true. */
const REAL_LOGIN_DISABLED = true;

async function boot(){
  if(REAL_LOGIN_DISABLED){
    state.authScreen = false;
    render();
    return;
  }
  state.booting = Cloud.hasSession();
  state.bootError = null;
  sessionJustExpired = false;
  render(); // skeleton while a saved session is checked, else the normal auth screen
  if(Cloud.hasSession()){
    try{
      await loadFromCloud();
      state.authScreen = false;
    }catch(err){
      /* A 401 with a failed refresh already pointed authScreen at the
         login form itself (see Cloud.onSessionExpired above). Anything
         else here — offline, timeout, a 5xx — isn't a real "you're
         logged out", so don't force the login screen over it; show a
         retry screen and leave the saved session alone instead. authScreen
         defaults to true on a cold load, so it can't tell these apart by
         itself — sessionJustExpired is the real signal. */
      if(!sessionJustExpired) state.bootError = 'network';
    }
    state.booting = false;
    render();
  }
}
boot();
loadOccasionsData();
</script>
