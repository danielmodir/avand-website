<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Single source for the brand mark. Swap assets/icons/logo-mark-
       accent.png (orange-ink variant of the monogram artwork; re-run
       the base64 embed below if it changes) to rebrand every page at
       once (per CLAUDE.md). Colors follow the Toojibee navy/orange
       palette (assets/css/tokens.css color secondary = navy circle,
       color primary = orange mark) that replaced the earlier blue
       circle plus "آ" placeholder, then the circle plus "ت" text
       placeholder. Embedded as a data URI, not a relative href,
       because some browsers won't fetch external image refs from an
       SVG loaded via img src. -->
  <circle cx="32" cy="32" r="32" fill="#14213D"/>
  <image href="data:image/png;base64," x="16" y="16" width="32" height="32" preserveAspectRatio="xMidYMid meet"/>
</svg>
