<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark-theme counterpart to logo-header.svg — orange circle + navy
       mark (the reverse of the light-theme file), same accessible-pair
       swap tokens.css already uses for its accent color (navy-on-white
       in light, orange-on-black in dark). Shown/hidden by site.css via
       [data-theme] on the two header img tags, same technique as the
       hero/showcase preview images. -->
  <circle cx="32" cy="32" r="32" fill="#FCA311"/>
  <image href="data:image/png;base64," x="9.6" y="9.6" width="44.8" height="44.8" preserveAspectRatio="xMidYMid meet"/>
</svg>
