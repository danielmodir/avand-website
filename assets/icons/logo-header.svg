<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marketing site header only (fa/en index.html .brand-mark) — same
       source monogram and navy circle as assets/icons/logo.svg, just
       with the Tj mark drawn 40% larger relative to the circle (44.8px
       vs the shared file's 32px, both against the same 64 viewBox).
       Kept as a separate file instead of resizing assets/icons/logo.svg
       itself, which stays the single source for every other usage
       (favicon, og-image, demo app banner, about/share pages per
       CLAUDE.md) and shouldn't change proportions just for this one
       header. The circle's own on-screen size change (10% bigger) is
       done via .brand-mark's CSS width/height in site.css instead,
       since that's just the container this SVG renders into. -->
  <circle cx="32" cy="32" r="32" fill="#14213D"/>
  <image href="data:image/png;base64," x="9.6" y="9.6" width="44.8" height="44.8" preserveAspectRatio="xMidYMid meet"/>
</svg>
