<script>(function(){
/* Lighter effects (no backdrop blur, css/theme.css) on every phone and in the
   Android app (its WebView redraws the blur under each frame of an animation,
   which made the app stutter), on weaker computers (<= 4 GB or <= 4 cores),
   or with ?lite to try it. */
if(window.ToojibeeAndroid)document.documentElement.classList.add('in-app'); // the Android app (still splash, below)
var n=navigator,m=window.matchMedia;if(/[?&]lite\b/.test(location.search)||window.ToojibeeAndroid||(m&&m('(pointer:coarse)').matches)||(n.deviceMemory&&n.deviceMemory<=4)||(n.hardwareConcurrency&&n.hardwareConcurrency<=4))document.documentElement.setAttribute('data-lite','');})();</script>
<style>
/* Splash: inline so it paints before any stylesheet or script arrives
   (slow, filtered networks). Its own few colors per palette x mode, the
   same semantic values as js/core/themes.js. Removed by
   start() in js/app.js once the app has rendered. */
#app-splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  --s-bg:var(--background);--s-arc:var(--primary);--s-text:var(--text-secondary);
  background:var(--s-bg);transition:opacity .18s ease,visibility .18s}
#app-splash.done{opacity:0;visibility:hidden}
.splash-mark{position:relative;width:112px;height:112px}
.splash-mark img{position:absolute;inset:20px;width:72px;height:72px;animation:splash-breathe 2s ease-in-out infinite}
.splash-dots{display:flex;gap:7px}
.splash-dots i{width:7px;height:7px;border-radius:50%;background:var(--s-arc);opacity:.25;animation:splash-dot 1.2s ease-in-out infinite}
.splash-dots i:nth-child(2){animation-delay:.15s}.splash-dots i:nth-child(3){animation-delay:.3s}
.splash-slow{font:600 13px/1.6 'Baloo Bhaijaan 2',Tahoma,system-ui,sans-serif;color:var(--s-text);text-align:center;opacity:0;animation:splash-slow .4s 12s forwards}
.splash-slow a{color:var(--s-arc)}
@keyframes splash-breathe{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
@keyframes splash-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@keyframes splash-slow{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#app-splash *{animation:none!important}.splash-slow{opacity:1;animation:none}}
.splash-name{font:800 22px/1.3 'Baloo Bhaijaan 2',Tahoma,system-ui,sans-serif;color:var(--s-text);text-align:center;margin-top:-6px}
.splash-name small{display:block;font-weight:600;font-size:13px;opacity:.8}
/* In the Android app its own splash carries on as a still mark and name. */
html.in-app .splash-dots{display:none}
html.in-app .splash-mark img{animation:none}
</style>
