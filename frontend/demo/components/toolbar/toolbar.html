<!-- One toolbar, same markup on both breakpoints — only flex-direction
     and position flip in the desktop media query (column/right-edge vs
     row/bottom-center). Profile+Management share one connected pill
     (#toolbar-avatar-btn keeps its circular photo/initials look, set
     in updateNav()); Add stays a visually separate circle but inside
     the same wrapper div, with a gap handled by the wrapper's own
     `gap`, not JS-measured positioning — repo owner's request: all
     three belong to one "toolbar" group in the markup. Store moved
     into the Profile page instead (disabled there, coming later). -->
<div class="toolbar" id="toolbar">
  <div class="toolbar-pill" id="toolbar-pill">
    <button class="toolbar-avatar-btn" id="toolbar-avatar-btn" data-action="open-menu" data-sub="profile" aria-label="Profile"></button>
    <button type="button" class="toolbar-admin-btn" data-action="open-menu" data-sub="admin" title="Management" aria-label="Management">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 2a1 1 0 0 0-1 1v1H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V3a1 1 0 0 0-1-1H9zm0 2h6v2H9V4zM6 8h12v12H6V8zm2 3v2h8v-2H8zm0 4v2h5v-2H8z"/></svg>
    </button>
    <!-- No period shortcut here (removed at the repo owner's request):
         the period desk is reached like any other, by swiping the
         workspace or from its title menu. -->
    <!-- Search (js/core/search.js): turns the bar into a search field. -->
    <button type="button" class="toolbar-admin-btn toolbar-search-btn" id="toolbar-search-btn" data-action="open-search" title="Search" aria-label="Search" aria-expanded="false" aria-controls="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    </button>
  </div>
  <button class="fab-add" id="fab-add" data-action="toggle-add-menu" aria-label="Add">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
  </button>
</div>
<!-- The bar the toolbar turns into while searching: magnifier on the left,
     close on the right; results open upward above it. -->
<div class="search-bar" id="search-bar" role="search" aria-hidden="true">
  <div class="search-results" id="search-results" role="listbox"></div>
  <div class="search-bar-inner" dir="ltr">
    <span class="search-bar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></span>
    <input type="search" id="search-input" dir="auto" autocomplete="off" enterkeyhint="search" aria-controls="search-results">
    <button type="button" class="search-bar-close" data-action="close-search" aria-label="Close search">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
    </button>
  </div>
</div>
