<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('toojibee-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script>
  /* Auto-pick a language instead of making every visitor tap a button:
     English only if the browser/system language clearly says so,
     everything else (Persian, unset, anything ambiguous) defaults to
     Persian — priority stays with fa per the repo owner's request. The
     chooser buttons below still work normally as a fallback (JS
     disabled, or this script's own redirect gets interrupted). */
  (function(){
    try{
      var navLang = ((navigator.language || (navigator.languages && navigator.languages[0]) || '') + '').toLowerCase();
      var dest = navLang.indexOf('en') === 0 ? 'en/' : 'fa/';
      location.replace(dest);
    }catch(e){}
  })();
</script>
<title>Toojibee</title>
<meta name="description" content="Toojibee — choose your language / زبان خود را انتخاب کنید.">
<link rel="canonical" href="https://avand.ir/">
<link rel="alternate" hreflang="en" href="https://avand.ir/en/">
<link rel="alternate" hreflang="fa" href="https://avand.ir/fa/">
<link rel="alternate" hreflang="x-default" href="https://avand.ir/">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div class="chooser">
  <img class="brand-mark" src="assets/icons/logo.svg" style="width:64px;height:64px;" alt="" aria-hidden="true">
  <div class="chooser-buttons">
    <a class="btn btn-primary" href="fa/" lang="fa" dir="rtl">فارسی</a>
    <a class="btn btn-outline" href="en/" lang="en" dir="ltr">English</a>
  </div>
</div>
</body>
</html>
