name: PHP API checks

on:
  push:
    branches: [codex/google-calendar-sync-2026-11-25]
  pull_request:
    paths:
      - 'backend-php/**'
      - '.github/workflows/php-checks.yml'

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-curl php-mbstring
      - name: Lint PHP sources
        run: find backend-php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test reminder windows
        run: php backend-php/tests/reminder-windows.php
      - name: Test Google Calendar grant
        run: php backend-php/tests/google-calendar-grant.php
      - name: Test Google Calendar conflict planning
        run: php backend-php/tests/google-calendar-diff.php
      - name: Test Google Calendar event projection
        run: php backend-php/tests/google-calendar-event.php
      - name: Test Google Calendar collection plan
        run: php backend-php/tests/google-calendar-plan.php
